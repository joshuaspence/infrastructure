---
# Read rather than gathered: Ansible has no fact for the board, and the UCTRONICS software only supports the Pi 4 and
# Pi 5, so anything else is skipped instead of being handed a display it cannot drive.
- name: 'Read the board model'
  ansible.builtin.stat:
    path: '/proc/device-tree/model'
  register: 'uctronics_rm0004_model_file'

- name: 'Resolve the board model'
  when: 'uctronics_rm0004_model_file.stat.exists'
  ansible.builtin.slurp:
    src: '/proc/device-tree/model'
  register: 'uctronics_rm0004_model'

# Kept as a fact rather than re-decoded at each use: the boot options below vary by board, so the model is needed
# after the guard as well as in it. The value keeps its trailing NUL, which no comparison here is sensitive to.
- name: 'Record the board model'
  when: 'uctronics_rm0004_model.content is defined'
  ansible.builtin.set_fact:
    uctronics_rm0004_board: '{{ uctronics_rm0004_model.content | b64decode }}'

- name: 'Install the UCTRONICS RM0004 support'
  when:
    - 'uctronics_rm0004_board is defined'
    - '"Raspberry Pi 4" in uctronics_rm0004_board or "Raspberry Pi 5" in uctronics_rm0004_board'
  block:
    # Checksummed either side of the include: the boot options only take effect at boot, and `/dev/i2c-1` alone
    # reports on `dtparam=i2c_arm`, so a host that already had I2C enabled would take the newly written
    # `gpio-shutdown` overlay without ever rebooting into it and report success with a dead power button. Both
    # reads are privileged because `stat` omits `checksum` for a file it cannot read, which would leave the comparison
    # below raising an undefined-attribute error instead of rebooting.
    - name: 'Read the boot configuration'
      become: true
      ansible.builtin.stat:
        path: '{{ uctronics_rm0004_boot_config }}'
      register: 'uctronics_rm0004_boot_config_before'

    - name: 'Configure the boot options'
      ansible.builtin.include_role:
        name: 'geerlingguy.raspberry-pi'
        apply:
          become: true
      vars:
        raspberry_pi_boot_config_options: '{{ uctronics_rm0004_boot_config_options }}'
        raspberry_pi_rc_local_options: []

    - name: 'Re-read the boot configuration'
      become: true
      ansible.builtin.stat:
        path: '{{ uctronics_rm0004_boot_config }}'
      register: 'uctronics_rm0004_boot_config_after'

    # `dtparam=i2c_arm` brings up the bus, but the character devices the display opens come from `i2c-dev`, which is not autoloaded.
    - name: 'Load i2c-dev at boot'
      become: true
      ansible.builtin.copy:
        dest: '/etc/modules-load.d/uctronics-rm0004.conf'
        content: 'i2c-dev'
        owner: 'root'
        group: 'root'
        mode: '0644'

    - name: 'Load i2c-dev now'
      become: true
      community.general.modprobe:
        name: 'i2c-dev'
        state: 'present'

    # The bus is checked as well as the checksum, so a host whose `config.txt` was already correct but which has not
    # yet booted into it still reboots. A host that is fully configured matches on both and never does.
    - name: 'Check whether the I2C bus is available'
      ansible.builtin.stat:
        path: '/dev/i2c-1'
      register: 'uctronics_rm0004_i2c'

    - name: 'Reboot to apply the boot configuration'
      when: >-
        not uctronics_rm0004_i2c.stat.exists
        or uctronics_rm0004_boot_config_before.stat.checksum
        != uctronics_rm0004_boot_config_after.stat.checksum
      become: true
      ansible.builtin.reboot:
        reboot_timeout: '{{ uctronics_rm0004_reboot_timeout }}'

    # The reboot does not verify itself. Without this a host whose boot options never take effect reboots on every run
    # and still reports success, which for a whole-group play is all three Pis going down each time; failing here
    # turns that silent loop into one error naming the thing that did not happen. Skipped under `--check`, where the
    # reboot never ran and an unconfigured host cannot have the bus yet.
    - name: 'Verify the boot configuration took effect'
      when: 'not ansible_check_mode'
      ansible.builtin.stat:
        path: '/dev/i2c-1'
      register: 'uctronics_rm0004_i2c_applied'
      failed_when: 'not uctronics_rm0004_i2c_applied.stat.exists'

    # `update_cache` because this playbook does not apply `common`, and a freshly flashed image has no package lists
    # at all, which fails the install rather than merely leaving it stale.
    - name: 'Install the build dependencies'
      become: true
      ansible.builtin.apt:
        name:
          - 'build-essential'
          - 'git'
        update_cache: true
        cache_valid_time: 3600

    - name: 'Clone the display source'
      become: true
      ansible.builtin.git:
        repo: '{{ uctronics_rm0004_repository }}'
        dest: '{{ uctronics_rm0004_source }}'
        version: '{{ uctronics_rm0004_version }}'
      register: 'uctronics_rm0004_clone'

    - name: 'Check whether the display has been built'
      ansible.builtin.stat:
        path: '{{ uctronics_rm0004_source }}/display'
      register: 'uctronics_rm0004_binary'

    # `--always-make` because the checkout above may have replaced sources that are newer than nothing, `make` having
    # no record of the previous build once the pin moves.
    - name: 'Build the display'
      when: 'uctronics_rm0004_clone.changed or not uctronics_rm0004_binary.stat.exists'
      become: true
      ansible.builtin.command:
        argv:
          - 'make'
          - '--always-make'
        chdir: '{{ uctronics_rm0004_source }}'
      changed_when: true
      notify: 'Restart the UCTRONICS display service'

    # Installed rather than run from the build tree: the binary reads only absolute paths, so it has no working
    # directory of its own to keep.
    - name: 'Install the display'
      become: true
      ansible.builtin.copy:
        src: '{{ uctronics_rm0004_source }}/display'
        dest: '/usr/local/bin/uctronics-display'
        remote_src: true
        owner: 'root'
        group: 'root'
        mode: '0755'
      notify: 'Restart the UCTRONICS display service'

    - name: 'Create the display service'
      become: true
      ansible.builtin.copy:
        dest: '/etc/systemd/system/{{ uctronics_rm0004_service }}'
        content: |
          [Unit]
          Description=UCTRONICS RM0004 OLED display
          After=multi-user.target

          [Service]
          ExecStart=/usr/local/bin/uctronics-display
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        owner: 'root'
        group: 'root'
        mode: '0644'
      notify: 'Restart the UCTRONICS display service'

    - name: 'Start the display service'
      become: true
      ansible.builtin.systemd_service:
        name: '{{ uctronics_rm0004_service }}'
        enabled: true
        state: 'started'
        daemon_reload: true
