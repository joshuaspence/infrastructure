---
# Skipped wholesale under `--check`: the file below is written by `svc.sh install`, which a check run does not perform,
# so against a host without a runner there is nothing to read and every task here would fail on a name it never learned.
# A check run reports nothing about the sandbox rather than reporting something untrue.
- name: 'Confine the runner service'
  when: 'not ansible_check_mode'
  become: true
  block:
    # Read rather than derived from the registration: `svc.sh install` decides the unit name and records it here, and
    # a drop-in whose directory does not match it is a file systemd never reads. Guessing wrong leaves the runner
    # unconfined and every task below reporting success.
    - name: 'Read the runner service name'
      ansible.builtin.slurp:
        src: '{{ github_runner_dir }}/.service'
      register: 'github_runner_service_file'

    - name: 'Record the runner service name'
      ansible.builtin.set_fact:
        github_runner_service: '{{ github_runner_service_file.content | b64decode | trim }}'

    - name: 'Create the runner service drop-in directory'
      ansible.builtin.file:
        path: '/etc/systemd/system/{{ github_runner_service }}.d'
        state: 'directory'
        owner: 'root'
        group: 'root'
        mode: '0755'

    - name: 'Install the runner service sandbox'
      ansible.builtin.template:
        src: 'sandbox.conf.j2'
        dest: '/etc/systemd/system/{{ github_runner_service }}.d/sandbox.conf'
        owner: 'root'
        group: 'root'
        mode: '0644'
      notify: 'Restart the GitHub Actions runner'

# The confinement only reaches the runner through the service, so it is worth nothing until the runner has been
# restarted under it. Flushed here rather than at the end of the play so that the check below is made against the
# running service and not the one that was already there.
- name: 'Apply the sandbox'
  ansible.builtin.meta: 'flush_handlers'

# Started here rather than by the upstream role, which is handed `stopped` for a host whose runner is not yet confined:
# this is the first point at which starting one is safe. A runner that was already running under the drop-in is left
# alone, having been restarted by the handler above if the drop-in changed.
- name: 'Start the runner service'
  when: 'not ansible_check_mode'
  become: true
  ansible.builtin.systemd_service:
    name: '{{ github_runner_service }}'
    enabled: true
    state: 'started'
    daemon_reload: true

# Nothing above proves systemd read the drop-in; a misnamed directory or a directive this systemd does not know is a
# quietly unconfined runner. `NoNewPrivileges` is not set by the generated unit, so systemd reporting it can only come
# from the drop-in. Skipped under `--check`, where the drop-in was never written.
- name: 'Verify that the sandbox is in effect'
  when: 'not ansible_check_mode'
  become: true
  ansible.builtin.command:
    argv:
      - 'systemctl'
      - 'show'
      - '--property=NoNewPrivileges'
      - '--value'
      - '{{ github_runner_service }}'
  register: 'github_runner_sandbox_applied'
  changed_when: false
  failed_when: '(github_runner_sandbox_applied.stdout | trim) != "yes"'

# The check above proves systemd read the drop-in, not that the runner can still do its job under it. The directive
# that decides the latter is `ProtectProc`: it hides PID 1, and the runner reads `/proc/1/cgroup` at the start of
# every containerised job to refuse the container feature when it is itself in a container. Every job on the host
# fails at "Initialize containers" if that read does not answer, so it is worth one command here rather than a job
# log per push. See `templates/sandbox.conf.j2` for what makes it readable again.
#
# Asked of the running service and as the runner account, not of the unit file and not as root: `systemctl show`
# would report a directive back whether or not this systemd knows it, and root is exempt from `hidepid` and would
# read the file whether or not the runner could. `--pid` is what puts the reader in front of the runner's PID 1
# rather than the host's, which is the whole of the difference being checked.
- name: 'Verify that the runner can make the container compatibility check'
  when: 'not ansible_check_mode'
  become: true
  block:
    - name: 'Find the runner process'
      ansible.builtin.command:
        argv:
          - 'systemctl'
          - 'show'
          - '--property=MainPID'
          - '--value'
          - '{{ github_runner_service }}'
      register: 'github_runner_main_pid'
      changed_when: false
      failed_when: '(github_runner_main_pid.stdout | trim | int) == 0'

    # The content is read as well as the exit status. A namespace whose PID 1 reported a Docker cgroup would leave the
    # runner refusing every job with `Container feature is not supported when runner is already running inside
    # container`, which is a working read and an equally broken host.
    - name: 'Read the init cgroup as the runner sees it'
      ansible.builtin.command:
        argv:
          - 'nsenter'
          - '--target'
          - '{{ github_runner_main_pid.stdout | trim }}'
          - '--mount'
          - '--pid'
          - '--'
          - 'setpriv'
          - '--reuid'
          - '{{ github_runner_user }}'
          - '--regid'
          - '{{ github_runner_user }}'
          - '--clear-groups'
          - 'cat'
          - '/proc/1/cgroup'
      register: 'github_runner_init_cgroup'
      changed_when: false
      failed_when: 'github_runner_init_cgroup.rc != 0 or ":/docker/" in github_runner_init_cgroup.stdout'
