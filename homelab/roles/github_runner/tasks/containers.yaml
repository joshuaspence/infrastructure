---
- name: 'Install the container engine'
  become: true
  vars:
    github_runner_tmpfiles_conf: '/etc/tmpfiles.d/github-runner.conf'
  block:
    - name: 'Install Podman'
      ansible.builtin.apt:
        name:
          - 'containernetworking-plugins'
          - 'fuse-overlayfs'
          - 'iptables'
          - 'podman'
          - 'slirp4netns'
          - 'uidmap'
        update_cache: true
        cache_valid_time: 3600

    # The runner shells out to a binary named `docker` and reads the server API version out of `docker version`,
    # failing the job when it comes back empty. Podman's own `podman-docker` shim answers that with a client version
    # and no server, so the real client is installed and pointed at the Podman API socket instead.
    - name: 'Install the Docker CLI'
      block:
        - name: 'Install the Docker apt keyring'
          ansible.builtin.get_url:
            url: 'https://download.docker.com/linux/debian/gpg'
            dest: '/etc/apt/keyrings/docker.asc'
            owner: 'root'
            group: 'root'
            mode: '0644'

        - name: 'Install the Docker apt repository'
          ansible.builtin.deb822_repository:
            name: 'docker'
            types: 'deb'
            uris: 'https://download.docker.com/linux/debian'
            suites: '{{ ansible_facts["distribution_release"] }}'
            components: 'stable'
            architectures: '{{ github_runner_docker_architectures[ansible_facts["architecture"]] }}'
            signed_by: '/etc/apt/keyrings/docker.asc'

        - name: 'Install the docker-ce-cli package'
          ansible.builtin.apt:
            name: 'docker-ce-cli'
            update_cache: true

    # Written rather than left to `useradd`, which allocates no range for a system account. The range is arbitrary so
    # long as nothing else on the host claims it; changing it later needs `podman system reset`, since the ids already
    # written into the image store no longer map.
    - name: 'Allocate the subordinate id range'
      ansible.builtin.lineinfile:
        path: '/etc/{{ item }}'
        regexp: '^{{ github_runner_user }}:'
        line: '{{ github_runner_user }}:{{ github_runner_subid_start }}:{{ github_runner_subid_count }}'
        create: true
        owner: 'root'
        group: 'root'
        mode: '0644'
      loop:
        - 'subuid'
        - 'subgid'
      notify: 'Restart the container engine'

    - name: 'Create the image store'
      ansible.builtin.file:
        path: '{{ github_runner_containers_dir }}'
        state: 'directory'
        owner: '{{ github_runner_user }}'
        group: '{{ github_runner_user }}'
        mode: '0750'

    # The runner mounts `/var/run/docker.sock` into every job container unconditionally, with no check that it is
    # there (`ContainerInfo.cs`, guarded only by `IsJobContainer`). Nothing serves that path here -- the engine
    # listens in `/run/github-runner` -- and rootless Podman cannot create a missing bind source under root-owned
    # `/run`, so without a placeholder every containerised job fails before its first step. An empty directory
    # satisfies the mount and gives the job nothing: a socket there would hand every job the engine's API, and with
    # it the ability to start a container that mounts the host.
    #
    # `/run` is a tmpfs, so this is written as a tmpfiles rule to survive a reboot as well as created now. It also
    # means a rootful Docker daemon could not claim the path later, which this design has no use for anyway.
    # Said plainly, because the failure it replaces is `systemd-tmpfiles` refusing to make a directory of something
    # that is already a socket, which reads as a packaging fault rather than as the thing it is: another engine
    # serving the path the runner mounts into every job container.
    - name: 'Check the reserved Docker socket path'
      ansible.builtin.stat:
        path: '/run/docker.sock'
      register: 'github_runner_docker_socket'

    - name: 'Verify that nothing else serves the Docker socket'
      ansible.builtin.assert:
        that: 'not github_runner_docker_socket.stat.exists or github_runner_docker_socket.stat.isdir'
        fail_msg: >-
          /run/docker.sock exists and is not a directory, so something is serving it -- a rootful Docker daemon, most
          likely. The runner mounts that path into every job container, so leaving it in place would hand each job the
          engine's API and, through it, a container that can mount the host. Remove it before applying this role.

    - name: 'Reserve the Docker socket path'
      ansible.builtin.copy:
        dest: '{{ github_runner_tmpfiles_conf }}'
        content: 'd /run/docker.sock 0555 root root -'
        owner: 'root'
        group: 'root'
        mode: '0644'

    # Created by applying the rule above rather than by a second task describing the same directory, so that the owner
    # and mode are stated in one place. Applied on every run rather than only when the rule changes: the path has to be
    # there before the engine starts, and a handler would not restore it on a host where something had removed it.
    - name: 'Create the reserved Docker socket path'
      ansible.builtin.command:
        argv:
          - 'systemd-tmpfiles'
          - '--create'
          - '{{ github_runner_tmpfiles_conf }}'
      changed_when: false

    # Ahead of the real `systemd-run` on the engine's `PATH`, for netavark's sake; `templates/systemd-run.j2` explains
    # what it is for. Owned by root and not writable by the engine account, which is what executes it, outside any
    # container: a job able to rewrite this would be running its own code on the host as the account that owns the
    # image store. Installed before the service that puts it on `PATH`, so that no start of the engine ever resolves
    # `systemd-run` to the real one.
    - name: 'Create the container engine helper directory'
      ansible.builtin.file:
        path: '{{ github_runner_podman_helper_dir }}'
        state: 'directory'
        owner: 'root'
        group: 'root'
        mode: '0755'

    - name: 'Install the systemd-run stand-in'
      ansible.builtin.template:
        src: 'systemd-run.j2'
        dest: '{{ github_runner_podman_helper_dir }}/systemd-run'
        owner: 'root'
        group: 'root'
        mode: '0755'
      notify: 'Restart the container engine'

    - name: 'Create the container engine service'
      ansible.builtin.template:
        src: 'podman.service.j2'
        dest: '/etc/systemd/system/{{ github_runner_podman_service }}'
        owner: 'root'
        group: 'root'
        mode: '0644'
      notify: 'Restart the container engine'

# Flushed before the service is started rather than at the end of the play, so that the engine the tasks below start
# and check is the one just configured. The handlers are the whole play's, not this role's, but the only others in it
# restart SSH, which is no worse for happening here.
- name: 'Apply the container engine configuration'
  ansible.builtin.meta: 'flush_handlers'

- name: 'Start the container engine service'
  become: true
  ansible.builtin.systemd_service:
    name: '{{ github_runner_podman_service }}'
    enabled: true
    state: 'started'
    daemon_reload: true

# The same check the runner makes before it will start a job container, made here so that a broken socket is one
# failed play rather than every job on the host failing at "Initialize containers". `podman unshare` covers what the
# version check cannot: the id range above, and the setuid helpers that apply it. It is given the same store the
# service runs on, since a check against the default rootless store would neither exercise that store nor leave the
# host with only the one.
- name: 'Verify the container engine'
  when: 'not ansible_check_mode'
  become: true
  become_user: '{{ github_runner_user }}'
  environment:
    DOCKER_HOST: 'unix://{{ github_runner_podman_runtime_dir }}/podman.sock'
    XDG_RUNTIME_DIR: '{{ github_runner_podman_runtime_dir }}'
  vars:
    github_runner_verify_network: 'github-runner-verify'
  block:
    - name: 'Verify that the container engine answers as a Docker daemon'
      ansible.builtin.command:
        argv:
          - 'docker'
          - 'version'
          - '--format'
          - '{{ "{{" }}.Server.APIVersion{{ "}}" }}'
      register: 'github_runner_docker_version'
      changed_when: false
      failed_when: '(github_runner_docker_version.stdout | trim) == ""'

    - name: 'Verify that the subordinate id range is usable'
      ansible.builtin.command:
        argv:
          - 'podman'
          - '--root'
          - '{{ github_runner_containers_dir }}'
          - '--runroot'
          - '{{ github_runner_podman_runtime_dir }}/containers'
          - 'unshare'
          - 'true'
      changed_when: false

    # The one thing every job does that the checks above do not reach: `docker version` answers from the API socket
    # without touching the network stack, so a host with no network backend passes every check here and then fails
    # each job at "Initialize containers". Removed either side of the create, since a run interrupted between the two
    # would otherwise leave behind a name the next run cannot create.
    - name: 'Remove the verification network left by an interrupted run'
      ansible.builtin.command:
        argv:
          - 'docker'
          - 'network'
          - 'rm'
          - '{{ github_runner_verify_network }}'
      changed_when: false
      failed_when: false

    - name: 'Verify that the container engine can create a job network'
      ansible.builtin.command:
        argv:
          - 'docker'
          - 'network'
          - 'create'
          - '{{ github_runner_verify_network }}'
      changed_when: false

    - name: 'Remove the verification network'
      ansible.builtin.command:
        argv:
          - 'docker'
          - 'network'
          - 'rm'
          - '{{ github_runner_verify_network }}'
      changed_when: false
      failed_when: false

    # Creating a network above does not start `aardvark-dns`; attaching a container to one does, which is why a host
    # whose DNS server cannot start passes every check before this and then fails each job at "Initialize containers".
    # The stand-in is exercised the way netavark calls it -- its options, then a command -- rather than looked for,
    # since it is worth nothing unless it drops the options and runs what follows. It refuses an option it does not
    # know rather than guessing, so a netavark that changed its invocation is a failure here and not a wrong command
    # run in the dark.
    - name: 'Verify that the systemd-run stand-in runs the command it is given'
      ansible.builtin.command:
        argv:
          - '{{ github_runner_podman_helper_dir }}/systemd-run'
          - '-q'
          - '--scope'
          - '--user'
          - '/bin/echo'
          - '{{ github_runner_verify_network }}'
      register: 'github_runner_systemd_run'
      changed_when: false
      failed_when: '(github_runner_systemd_run.stdout | trim) != github_runner_verify_network'

# Both checks below are put to the running engine rather than to its unit file, and for the same reason: `systemctl
# show` reports a directive back whether or not it took effect, and what is worth catching here is exactly what it
# cannot see.
- name: 'Verify the container engine as it is running'
  when: 'not ansible_check_mode'
  become: true
  block:
    - name: 'Find the container engine process'
      ansible.builtin.command:
        argv:
          - 'systemctl'
          - 'show'
          - '--property=MainPID'
          - '--value'
          - '{{ github_runner_podman_service }}'
      register: 'github_runner_podman_pid'
      changed_when: false
      failed_when: '(github_runner_podman_pid.stdout | trim | int) == 0'

    - name: 'Read the environment the container engine is running with'
      ansible.builtin.slurp:
        src: '/proc/{{ github_runner_podman_pid.stdout | trim }}/environ'
      register: 'github_runner_podman_environ'

    # netavark reaches the stand-in by name, so whether a containerised job starts at all comes down to the engine
    # holding this directory ahead of `/usr/bin`. Read off the process because a unit that was edited and not
    # restarted reports the `PATH` it would take next time while serving with the one it has.
    - name: 'Verify that the container engine took the helper directory onto its PATH'
      vars:
        github_runner_podman_path: 'PATH={{ github_runner_podman_helper_dir }}:'
      ansible.builtin.assert:
        that: 'github_runner_podman_path in (github_runner_podman_environ.content | b64decode)'
        fail_msg: >-
          The container engine is not running with {{ github_runner_podman_helper_dir }} at the front of its PATH, so
          netavark will find the real systemd-run, which cannot start aardvark-dns for an account with no user
          session. Every containerised job would fail at "Initialize containers".

    # A path that was missing when the service started is skipped for the lifetime of that start, without a word in
    # the journal, so this is asked of the engine's own view of the filesystem, which `/proc/<pid>/root` resolves
    # into. Every masked path is checked rather than only the key: they are masked by one directive and skipped by one
    # rule, so any of them can be the one that was missing.
    #
    # What is looked at is the mode. systemd mounts an empty file, or an empty directory, of mode `0000` over each
    # path, so `0000` is the mask and anything else is the real thing a job could have named in its
    # `container.volumes`. The mode also covers `_diag`, which being a directory has no size worth reading. Nothing of
    # the contents is looked at, so a failure here does not put the key into the play's output.
    - name: 'Inspect the masked paths as the container engine sees them'
      ansible.builtin.stat:
        path: '/proc/{{ github_runner_podman_pid.stdout | trim }}/root{{ github_runner_dir }}/{{ item }}'
        get_checksum: false
      register: 'github_runner_masked'
      failed_when: 'not github_runner_masked.stat.exists or github_runner_masked.stat.mode != "0000"'
      loop:
        - '.credentials'
        - '.credentials_rsaparams'
        - '.runner'
        - '_diag'
