---
# `monolithprojects.github_actions_runner` runs `config.sh` and `svc.sh install` as this account and gives it ownership
# of the runner directory, but never creates it.
- name: 'Create the runner user account'
  become: true
  ansible.builtin.user:
    name: '{{ github_runner_user }}'
    home: '{{ github_runner_home }}'
    shell: '/usr/sbin/nologin'
    password: '!'
    system: true

# Created here rather than left to whichever task first has cause to: `useradd` makes it only when the account is new,
# `usermod` never does, and a directory that first appears as the parent of something else inherits that thing's mode.
# The upstream role reads under here as the connection account, so it has to stay traversable by more than the runner.
- name: 'Create the runner home directory'
  become: true
  ansible.builtin.file:
    path: '{{ github_runner_home }}'
    state: 'directory'
    owner: '{{ github_runner_user }}'
    group: '{{ github_runner_user }}'
    mode: '{{ github_runner_home_mode }}'

- name: 'Limit the resources of the runner and the container engine'
  become: true
  ansible.builtin.template:
    src: 'slice.j2'
    dest: '/etc/systemd/system/{{ github_runner_slice }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload the systemd configuration'

- name: 'Install the runner'
  ansible.builtin.include_role:
    name: 'monolithprojects.github_actions_runner'
  vars:
    access_token: '{{ github_runner_access_token }}'
    github_account: '{{ github_runner_organization }}'
    runner_dir: '{{ github_runner_dir }}'
    runner_group: '{{ github_runner_group }}'
    runner_name: '{{ github_runner_name }}'
    runner_org: true
    runner_user: '{{ github_runner_user }}'
    runner_version: '{{ github_runner_version }}'

# `config.sh` writes these as the runner account but under the connection umask, not the runner service's `UMask=`,
# which only governs what the service itself creates. So they land world-readable in a directory the upstream role
# keeps at `0755`, and `.credentials_rsaparams` is the key the runner authenticates to GitHub with -- readable by
# `pi`, and by anything a job leaves behind under an account of its own.
#
# The mode is fixed on the files rather than on the directory around them: the upstream role resets that to `0755` on
# every run, and it reads `bin/Runner.Listener.deps.json` and `.service` under it as the connection account, so a
# directory a job's account cannot read is a directory the next play cannot use either.
- name: 'Restrict the runner credentials'
  become: true
  ansible.builtin.file:
    path: '{{ github_runner_dir }}/{{ item }}'
    owner: '{{ github_runner_user }}'
    group: '{{ github_runner_user }}'
    mode: '0600'
  loop:
    - '.credentials'
    - '.credentials_rsaparams'
    - '.runner'

# After the runner, so that the credentials above exist by the time the engine starts: they are masked from it with
# `InaccessiblePaths=`, and systemd skips a path that is missing at start rather than applying it later.
- name: 'Install the container engine'
  ansible.builtin.import_tasks: 'containers.yaml'

- name: 'Sandbox the CI jobs'
  ansible.builtin.import_tasks: 'sandbox.yaml'
