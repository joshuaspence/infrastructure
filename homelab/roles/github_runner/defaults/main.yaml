---
# The GitHub CLI APT repository publishes `amd64`, `arm64` and `armhf`, but Ansible reports the kernel architecture,
# which spells those differently.
github_runner_gh_architecture: '{{ github_runner_gh_architectures[ansible_facts["architecture"]] }}'
github_runner_gh_architectures:
  aarch64: 'arm64'
  armv6l: 'armhf'
  armv7l: 'armhf'
  x86_64: 'amd64'
github_runner_gh_keyring: '/etc/apt/keyrings/githubcli-archive-keyring.gpg'
github_runner_user: 'github-runner'
