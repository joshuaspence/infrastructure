---
github_runner_user: 'github-runner'

# The RM0004's OLED is driven over I2C and its power button is wired to GPIO 4, neither of which the kernel exposes
# until the boot configuration turns them on. Set to `false` for a runner that is not mounted in the rack.
github_runner_uctronics: true
github_runner_uctronics_reboot_timeout: 600
github_runner_uctronics_service: 'uctronics-display.service'
github_runner_uctronics_source: '/usr/local/src/uctronics-rm0004'

# Pinned to a commit rather than tracked on `main`: the upstream publishes no releases, so a floating branch would
# silently change what gets compiled onto the host between runs.
github_runner_uctronics_repository: 'https://github.com/UCTRONICS/SKU_RM0004.git'
github_runner_uctronics_version: 'a9cfa2345f83d4e2f0ea8013d3634eee42105bb0'

# `gpio-shutdown` is the whole of the power button: the kernel overlay turns a GPIO 4 short into an ACPI power event,
# so a short press shuts the Pi down cleanly with nothing running in userspace to handle it.
github_runner_uctronics_boot_config_options:
  - regexp: '^#?dtparam=i2c_arm'
    line: 'dtparam=i2c_arm=on,i2c_arm_baudrate=400000'
  - regexp: '^#?dtoverlay=gpio-shutdown'
    line: 'dtoverlay=gpio-shutdown,gpio_pin=4,active_low=1,gpio_pull=up'
