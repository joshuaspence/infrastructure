---
github_runner_dir: '/opt/github/actions-runner'
github_runner_name: '{{ inventory_hostname }}'
github_runner_user: 'github-runner'

# Kept out of `/home` so that `/home`, which holds the administrative accounts and their SSH keys, can be hidden from
# CI jobs wholesale rather than hidden around the one directory the runner needs.
github_runner_home: '/opt/github/home'

# Root owned and outside every path a job can write to, so that a job cannot rewrite the cleanup that runs after it.
github_runner_sandbox_dir: '/opt/github/sandbox'

# The runners share their Pi with nothing else, so these only need to leave the host enough to stay reachable while a
# job is misbehaving. A job that exceeds them is killed; the runner is restarted.
github_runner_sandbox_memory_max: '75%'
github_runner_sandbox_tasks_max: 512

# Everything outside the runner directory and its home is read-only to a job. Anything a job legitimately needs to
# write elsewhere has to be listed here, since the alternative it will reach for is turning the sandbox off.
github_runner_sandbox_read_write_paths: []

# Rootless Podman, running as the runner account, serving the Docker-compatible API the runner speaks. Kept in its own
# service so that the runner itself never needs the namespace, mount and `/dev/fuse` access a container engine does,
# and keeps the confinement in `templates/sandbox.conf.j2`.
github_runner_containers_dir: '/opt/github/containers'
github_runner_podman_runtime_dir: '/run/github-runner'
github_runner_podman_service: 'github-runner-podman.service'

# Rootless containers map the account onto a range of unused ids. `useradd --system` allocates none, and Podman
# without a range gives every container a single uid, which almost no image survives.
github_runner_subid_count: 65536
github_runner_subid_start: 200000

# `ansible_facts.architecture` reports the kernel architecture (e.g. `aarch64`), whereas apt expects the Debian
# architecture (e.g. `arm64`).
github_runner_docker_architectures:
  aarch64: 'arm64'
  armv7l: 'armhf'
  x86_64: 'amd64'
